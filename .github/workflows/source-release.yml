name: Source Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
    paths:
      - ".github/release-requests/v*.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run publication gate
        run: pnpm verify:publication

      - name: Resolve governed source release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          license="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).license")"
          private_pkg="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).private")"
          expected_tag="v${version}"

          if [[ "$license" != "Apache-2.0" ]]; then
            echo "Expected Apache-2.0 source license; found $license" >&2
            exit 1
          fi
          if [[ "$private_pkg" != "true" ]]; then
            echo "Root package must remain private=true to prevent accidental npm publication" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$expected_tag"
            request_path=".github/release-requests/${release_tag}.json"
            if [[ ! -f "$request_path" ]]; then
              echo "Missing governed source release request: $request_path" >&2
              exit 1
            fi
            node --input-type=module - "$request_path" "$release_tag" <<'NODE'
          import { readFileSync } from "node:fs";
          const [, , requestPath, releaseTag] = process.argv;
          const request = JSON.parse(readFileSync(requestPath, "utf8"));
          if (request.schemaVersion !== "bossai.os-core.source-release-request.v1") throw new Error("Unexpected release request schemaVersion");
          if (request.tag !== releaseTag) throw new Error(`Release request tag ${request.tag} does not match ${releaseTag}`);
          if (request.license !== "Apache-2.0") throw new Error(`Release request license must be Apache-2.0; received ${request.license}`);
          if (request.sourceOnly !== true) throw new Error("Release request must be sourceOnly=true");
          NODE
          fi

          if [[ "$release_tag" != "$expected_tag" ]]; then
            echo "Release tag $release_tag does not match package version; expected $expected_tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Create governed source tag when requested from main
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; leaving it unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "BossAI OS Core $RELEASE_TAG Apache-2.0 Source Release"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish Apache source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "BossAI OS Core $RELEASE_TAG — Apache-2.0 Source Release" \
            --notes "Enterprise-friendly developer primitives for governed AI applications under Apache License 2.0. Includes AI contracts, Skill and Workflow primitives, file parsing, local RAG, and webhook security. Commercial runtime, provider credentials/routing, billing/points, marketplace, proprietary agents, customer data, and other BossAI product authority remain outside this public repository. Historical v0.1.0 remains available under the AGPL rights granted for that revision; see LICENSE_HISTORY.md. This is a source release and does not create or imply any separate BossAI commercial runtime or entitlement authority."
